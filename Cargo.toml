[package]
name = "fractal_farm"
version = "0.1.0"
authors = ["Hendrik Schawe <surt91@gmail.com>"]
edition = "2021"

[dependencies]
a_fractal_a_day = { version = "^0.1.2", git = "https://github.com/surt91/AFractalADay" }

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.7", features = ["fs"] }
tera = { version = "1.20", default-features = false }

r2d2 = "0.8"
diesel = { version = "2.2", features = ["sqlite", "r2d2"] }
dotenv = "0.13"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

rand = "0.6"
time = "0.3"
sha2 = "0.7"
